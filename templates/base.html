{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Procurement execution{% endblock %}</title><link rel="stylesheet" href="{% static 'app.css' %}"></head>
<body><header><a href="{% url 'dashboard' %}">Procurement execution</a>{% if user.is_authenticated %}<div>{{ user.get_username }} <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form></div>{% endif %}</header><main>{% for message in messages %}<p role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
